# =============================================================================
# Cluster Route — 发布流水线
#
# 触发: 推送 v 开头的 tag; 或手动 workflow_dispatch(可指定版本号试跑,
#       此时产物只上传到该 run 的 artifacts, 不创建 GitHub Release)。
#
#  Linux (ubuntu-24.04, amd64)
#     cluster-route-<ver>-1.x86_64.rpm            桌面应用
#     cluster-route_<ver>_linux_amd64.deb         桌面应用
#     cluster-route-server-<ver>-1.x86_64.rpm     无头服务 + systemd 单元
#     cluster-route-server_<ver>_linux_amd64.deb  无头服务
#     cluster-route_<ver>_linux_amd64.tar.gz      便携包(两种形态 + install.sh)
#
#  Windows (windows-latest, x64)
#     Cluster-Route-<ver>-x64-Setup.exe           NSIS 安装器
#     Cluster-Route-<ver>-x64-Portable.zip        便携版(桌面 + 无头)
#
# 改 workflow 前必读的四个约定:
#   1. 桌面 Linux 构建必须带 `-tags webkit2_41`。Wails v2 的 Linux 前端默认
#      链接 webkit2gtk-4.0 + libsoup-2.4, 而 ubuntu-24.04 只提供 4.1,
#      不带该标签会直接编译失败; 相应地 RPM Requires 也必须是 webkit2gtk4.1。
#   2. 无头服务以 CGO_ENABLED=0 全静态链接。它不 import wails
#      (internal/app 不含 wails 依赖), 因此没有 GTK/WebKit 运行时依赖,
#      这也是把它单独打成 cluster-route-server 包的原因。
#   3. 版本号唯一来源是 tag: 先把版本写进 build/windows/info.json, 再让
#      go-winres(wails) / patchversion / NSIS(VI* 版本栏) 三处读取同一份。
#   4. wails.json 的 outputfilename 是 "Cluster Route"(带空格), 引号别省。
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 0.3.0)。仅手动试跑用: 产物只上传到 artifacts, 不建 Release'
        required: false
        default: ''

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  WAILS_VERSION: v2.16.0
  NFPM_VERSION: v2.47.0

jobs:
  # ===========================================================================
  # Linux
  # ===========================================================================
  linux:
    name: 'Linux · deb / rpm / tar.gz'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Put Go bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # tag 推送: 取 v 后缀; 手动触发: 取输入值; 空则失败而不是产出 0.0.0
      - name: Resolve version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          case "$VER" in v*) VER="${VER#v}" ;; esac   # 容忍 workflow_dispatch 里写 v0.3.0
          if [ -z "$VER" ]; then
            echo "::error::无法从 '${GITHUB_REF_NAME}' 推断版本号, tag 形如 v1.2.3"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "释出版本: $VER"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # Wails v2 在 Linux 需要 pkg-config/build-essential/nasm 与 GTK3、
      # WebKit2GTK 头文件。装 4.1(而非 4.0) 以匹配 ubuntu-24.04。
      - name: Install GTK / WebKit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential nasm rpm \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      - name: Build frontend (web/dist)
        working-directory: web
        run: npm ci && npm run build:fast

      # 无头服务: 纯 Go 全静态, 无 GTK/WebKit 依赖
      - name: Build headless server (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist-linux
          go build -trimpath -ldflags '-s -w' -o dist-linux/cluster-route-server .
          echo "--- 应为静态可执行 ---"
          ldd dist-linux/cluster-route-server 2>&1 || true

      # 桌面应用: 必须带 webkit2_41; -s 跳过前端(上一步已构建)
      # -o 显式指定输出名: wails 对 linux 平台不会自动追加 -linux-amd64 后缀
      - name: Build desktop app (Wails)
        run: |
          set -euo pipefail
          wails build -skipbindings -s -clean -platform linux/amd64 -tags webkit2_41 \
            -o "Cluster Route-linux-amd64"
          ls -l build/bin/

      - name: Verify Linux ELF linkage
        run: |
          set -euo pipefail
          for f in "build/bin/Cluster Route-linux-amd64" dist-linux/cluster-route-server; do
            echo "--- $f ---"
            ldd "$f" | grep -Ei 'webkit2gtk|libsoup|libgtk-3' || echo "(no gtk/webkit deps)"
          done

      - name: Stage payload
        run: |
          set -euo pipefail
          mkdir -p stage/usr/bin \
                   stage/usr/share/applications \
                   stage/usr/share/metainfo \
                   stage/usr/lib/systemd/system

          install -Dm755 "build/bin/Cluster Route-linux-amd64" stage/usr/bin/cluster-route
          install -Dm755 dist-linux/cluster-route-server       stage/usr/bin/cluster-route-server
          install -Dm644 packaging/linux/cluster-route.desktop \
                        stage/usr/share/applications/cluster-route.desktop
          install -Dm644 packaging/linux/cluster-route-server.service \
                        stage/usr/lib/systemd/system/cluster-route-server.service

          # hicolor 全尺寸图标(源文件 build/icon-*.png 已入库)
          for s in 16 24 32 48 64 128 256 512; do
            install -Dm644 "build/icon-$s.png" \
                          "stage/usr/share/icons/hicolor/${s}x${s}/apps/cluster-route.png"
          done

          # AppStream 元数据: 版本/日期从 tag 注入
          sed -e "s/@@VERSION@@/${VERSION}/g" \
              -e "s/@@DATE@@/$(date -u +%F)/g" \
              packaging/linux/cluster-route.metainfo.xml \
              > stage/usr/share/metainfo/cluster-route.metainfo.xml

      - name: Build deb + rpm (desktop app)
        run: |
          set -euo pipefail
          sed -e "s/@@VERSION@@/${VERSION}/g" -e "s/@@ARCH@@/amd64/g" \
              packaging/nfpm-desktop.yaml > dist-linux/nfpm-desktop.yaml
          nfpm package --config dist-linux/nfpm-desktop.yaml --packager deb \
              --target "dist-linux/cluster-route_${VERSION}_linux_amd64.deb"
          nfpm package --config dist-linux/nfpm-desktop.yaml --packager rpm \
              --target "dist-linux/cluster-route-${VERSION}-1.x86_64.rpm"

      - name: Build deb + rpm (headless server)
        run: |
          set -euo pipefail
          sed -e "s/@@VERSION@@/${VERSION}/g" -e "s/@@ARCH@@/amd64/g" \
              packaging/nfpm-server.yaml > dist-linux/nfpm-server.yaml
          nfpm package --config dist-linux/nfpm-server.yaml --packager deb \
              --target "dist-linux/cluster-route-server_${VERSION}_linux_amd64.deb"
          nfpm package --config dist-linux/nfpm-server.yaml --packager rpm \
              --target "dist-linux/cluster-route-server-${VERSION}-1.x86_64.rpm"

      - name: Build portable tar.gz
        run: |
          set -euo pipefail
          ROOT="cluster-route-${VERSION}-linux-amd64"
          rm -rf "dist-linux/${ROOT}"
          mkdir -p "dist-linux/${ROOT}/icons/hicolor"

          cp dist-linux/cluster-route-server      "dist-linux/${ROOT}/"
          cp "build/bin/Cluster Route-linux-amd64" "dist-linux/${ROOT}/cluster-route"
          cp packaging/linux/cluster-route.desktop "dist-linux/${ROOT}/"
          cp packaging/linux/install-portable.sh  "dist-linux/${ROOT}/install.sh"
          cp README.md                             "dist-linux/${ROOT}/README.md"
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p "dist-linux/${ROOT}/icons/hicolor/${s}x${s}/apps"
            cp "build/icon-$s.png" \
               "dist-linux/${ROOT}/icons/hicolor/${s}x${s}/apps/cluster-route.png"
          done

          chmod +x "dist-linux/${ROOT}/install.sh"

          tar -C dist-linux -czf "dist-linux/cluster-route_${VERSION}_linux_amd64.tar.gz" "${ROOT}"
          ls -l dist-linux/

      # 兜底校验: 包内容 / 依赖声明 / 二进制真实链接库三者要对得上
      - name: Sanity check packages
        run: |
          set -euo pipefail
          echo "=== rpm 内容(desktop) ==="
          rpm -qlp "dist-linux/cluster-route-${VERSION}-1.x86_64.rpm"
          echo; echo "=== rpm Requires(desktop) ==="
          rpm -qRp "dist-linux/cluster-route-${VERSION}-1.x86_64.rpm"
          echo; echo "=== rpm Requires(server, 期望仅 systemd) ==="
          rpm -qRp "dist-linux/cluster-route-server-${VERSION}-1.x86_64.rpm"
          echo; echo "=== deb 内容(desktop) ==="
          dpkg-deb -c "dist-linux/cluster-route_${VERSION}_linux_amd64.deb"
          echo; echo "=== deb Depends(desktop) ==="
          dpkg-deb -f "dist-linux/cluster-route_${VERSION}_linux_amd64.deb" Depends
          echo; echo "=== 桌面应用真实 NEEDED(应为 webkit2gtk-4.1) ==="
          readelf -d "build/bin/Cluster Route-linux-amd64" \
            | awk '/NEEDED/ {gsub(/[][]/,"",$NF); print $NF}' | sort
          echo; echo "=== 无头服务真实 NEEDED(期望为空: 静态) ==="
          readelf -d dist-linux/cluster-route-server 2>/dev/null \
            | awk '/NEEDED/ {gsub(/[][]/,"",$NF); print $NF}' | sort || echo "(static, no dynamic section)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist-linux/cluster-route_${{ env.VERSION }}_linux_amd64.deb
            dist-linux/cluster-route_${{ env.VERSION }}_linux_amd64.tar.gz
            dist-linux/cluster-route-${{ env.VERSION }}-1.x86_64.rpm
            dist-linux/cluster-route-server_${{ env.VERSION }}_linux_amd64.deb
            dist-linux/cluster-route-server-${{ env.VERSION }}-1.x86_64.rpm
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Windows
  # ===========================================================================
  windows:
    name: 'Windows · installer / portable'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Put Go bin on PATH
        shell: bash
        run: echo "$(go env GOPATH)\bin" >> "$GITHUB_PATH"

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          case "$VER" in v*) VER="${VER#v}" ;; esac
          if [ -z "$VER" ]; then
            echo "::error::无法从 '${GITHUB_REF_NAME}' 推断版本号"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "释出版本: $VER"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # 版本号唯一来源是 tag: 改写 info.json, 让 go-winres / patchversion /
      # NSIS 的 VI* 版本栏读到同一个版本
      - name: Stamp version into build/windows/info.json
        shell: bash
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" --arg f "$VERSION.0" \
            '.fixed.file_version      = $f
             | .fixed.product_version = $f
             | .info["0000"].ProductVersion = $v' \
            build/windows/info.json > build/windows/info.json.tmp
          mv build/windows/info.json.tmp build/windows/info.json
          cat build/windows/info.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend (web/dist)
        shell: bash
        working-directory: web
        run: npm ci && npm run build:fast

      # wails build 硬编码 OutputType=desktop, 自动注入 `-tags desktop`
      # 与 `-H windowsgui`, 产出桌面 GUI —— 无需也不能再手工传 desktop 标签。
      # 默认产出 build/bin/Cluster Route.exe(outputfilename 带空格)。
      - name: Build desktop app (Wails)
        shell: bash
        run: |
          set -euo pipefail
          wails build -skipbindings -s -clean
          ls -l build/bin/

      - name: Build headless server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-win
          go build -trimpath -ldflags '-s -w' -o dist-win/cluster-route-server.exe .

      # 必须在 NSIS 打包之前修补, 打包对象是已修补的 exe
      - name: Patch VERSIONINFO
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/patchversion -exe 'build/bin/Cluster Route.exe'
          go run ./tools/patchversion -exe dist-win/cluster-route-server.exe \
                                      -original dist-win/cluster-route-server.exe

      - name: Verify VERSIONINFO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('build\bin\Cluster Route.exe', 'dist-win\cluster-route-server.exe')) {
            $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($f)
            Write-Host "$f -> Company=$($vi.CompanyName) Product=$($vi.ProductName) FileVersion=$($vi.FileVersion)"
            if ($vi.CompanyName -ne 'OpenALC') { throw "CompanyName 不是 OpenALC: $f" }
            if (-not $vi.FileVersion.StartsWith($env:VERSION)) { throw "FileVersion $($vi.FileVersion) 与 tag $($env:VERSION) 不符" }
          }

      # windows-latest(2025)镜像已不内置 NSIS, 需自行安装
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # wails.webview2runtime 宏写死了 File "tmp\MicrosoftEdgeWebview2Setup.exe",
      # 文件缺失时 makensis 直接失败(宏不联网下载), 故先拉取引导程序。
      - name: Download WebView2 bootstrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows/installer/tmp
          curl -fsSL -o build/windows/installer/tmp/MicrosoftEdgeWebview2Setup.exe \
            'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          ls -l build/windows/installer/tmp/

      # 用相对路径传 exe: NSIS 跑在 Windows 侧, 不懂 Git Bash 的 /d/a/... 路径
      - name: Build NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          MAKENSIS="$(command -v makensis || true)"
          if [ -z "$MAKENSIS" ]; then
            for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
              [ -x "$d/makensis.exe" ] && MAKENSIS="$d/makensis.exe" && break
            done
          fi
          [ -n "$MAKENSIS" ] || { echo "::error::找不到 makensis"; exit 1; }
          echo "makensis = $MAKENSIS"

          # INFO_PRODUCTVERSION 在 wails_tools.nsh 中以 !ifndef 保护, 可注入
          pushd build/windows/installer
          "$MAKENSIS" \
            -DINFO_PRODUCTVERSION="$VERSION" \
            -DARG_WAILS_AMD64_BINARY='..\..\bin\Cluster Route.exe' \
            project.nsi
          popd
          ls -l build/bin/

      - name: Stage portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          P="dist-win/Cluster-Route-${VERSION}-x64-Portable"
          rm -rf "$P"
          mkdir -p "$P/data"

          cp 'build/bin/Cluster Route.exe'      "$P/Cluster Route.exe"
          cp dist-win/cluster-route-server.exe  "$P/cluster-route-server.exe"
          cp README.md                          "$P/README.md"
          cp packaging/windows/PORTABLE-README.txt "$P/使用说明.txt"
          # 占位, 保证空 data/ 能进 zip(便携模式的默认数据目录)
          printf 'Cluster Route portable data directory.\n' > "$P/data/.keep"

          # tar 自带 zip 支持, 不需额外装压缩工具
          tar -a -c -f "dist-win/Cluster-Route-${VERSION}-x64-Portable.zip" \
              -C dist-win "Cluster-Route-${VERSION}-x64-Portable"
          ls -l dist-win/

      - name: Rename installer for release
        shell: bash
        run: |
          set -euo pipefail
          mv 'build/bin/Cluster Route-amd64-installer.exe' \
             "dist-win/Cluster-Route-${VERSION}-x64-Setup.exe"
          ls -l dist-win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist-win/Cluster-Route-${{ env.VERSION }}-x64-Setup.exe
            dist-win/Cluster-Route-${{ env.VERSION }}-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # 发布(仅在 tag 推送时执行; workflow_dispatch 试跑不建 Release)
  # ===========================================================================
  release:
    name: 'Publish GitHub Release'
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in v*) VER="${VER#v}" ;; esac
          if [ -z "$VER" ]; then
            echo "::error::无法从 '${GITHUB_REF_NAME}' 推断版本号"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          set -euo pipefail
          sed "s/@@V@@/${{ steps.ver.outputs.version }}/g" \
              packaging/release-notes.md.tmpl > release-notes.md
          head -3 release-notes.md

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          FILES="cluster-route_${VERSION}_linux_amd64.deb
          cluster-route_${VERSION}_linux_amd64.tar.gz
          cluster-route-${VERSION}-1.x86_64.rpm
          cluster-route-server_${VERSION}_linux_amd64.deb
          cluster-route-server-${VERSION}-1.x86_64.rpm
          Cluster-Route-${VERSION}-x64-Setup.exe
          Cluster-Route-${VERSION}-x64-Portable.zip
          SHA256SUMS.txt"
          for f in $FILES; do
            [ -f "$f" ] || { echo "::error::缺少产物: $f"; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在, 追加/覆盖上传"
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            # 想先人工复核再公开: 在下一行加 --draft
            gh release create "$GITHUB_REF_NAME" $FILES \
              --title "Cluster Route ${VERSION}" \
              --notes-file ../release-notes.md \
              --verify-tag
          fi
