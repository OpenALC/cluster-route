# nfpm 配置: Cluster Route 桌面应用(GTK + WebKit2GTK)
#
# 由 .github/workflows/release.yml 生成 .deb / .rpm。
# 占位符 @@VERSION@@ / @@ARCH@@ 在打包前由 workflow 注入。
name: "cluster-route"
arch: "@@ARCH@@"
platform: "linux"
version: "@@VERSION@@"
version_schema: none
release: "1"
section: "net"
priority: "optional"
maintainer: "OpenALC <https://github.com/openalc/cluster-route>"
vendor: "OpenALC"
homepage: "https://github.com/openalc/cluster-route"
license: "MIT"

# 桌面形态需要 GTK3 + WebKit2GTK 4.1。注意: 该二进制由 Wails 以
# `-tags webkit2_41` 链接 libwebkit2gtk-4.1.so.1, 因此必须依赖 4.1
# 而不是部分发行版仍提供的 4.0 —— RHEL/Rocky/AlmaLinux 9 用户需先从
# EPEL/CRB 安装 webkit2gtk4.1。
description: |
  Cluster Route desktop application (native GTK window).
  Local model relay gateway: unifies multiple model providers behind one
  entry point, transparently forwarding Anthropic (/v1/messages) and OpenAI
  (/v1/chat/completions) requests with usage accounting, quota failover and
  session archiving. Listens on 127.0.0.1 only.
  The headless form of the same product is available as cluster-route-server.

overrides:
  deb:
    depends:
      - webkit2gtk-4.1-3
      - gtk-3-0
      - libsoup-3.0-0
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3
      - libsoup3

contents:
  # 可执行文件
  - src: "stage/usr/bin/cluster-route"
    dst: "/usr/bin/cluster-route"
    file_info:
      mode: 0755

  # 桌面集成
  - src: "stage/usr/share/applications/cluster-route.desktop"
    dst: "/usr/share/applications/cluster-route.desktop"
    file_info:
      mode: 0644

  - src: "stage/usr/share/metainfo/cluster-route.metainfo.xml"
    dst: "/usr/share/metainfo/cluster-route.metainfo.xml"
    file_info:
      mode: 0644

  # hicolor 图标(16..512 全尺寸, 覆盖面板/桌面/高分屏)
  - src: "stage/usr/share/icons/hicolor/16x16/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/24x24/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/32x32/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/48x48/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/64x64/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/128x128/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/256x256/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/cluster-route.png"
    file_info:
      mode: 0644
  - src: "stage/usr/share/icons/hicolor/512x512/apps/cluster-route.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/cluster-route.png"
    file_info:
      mode: 0644

scripts:
  postinstall: |
    #!/bin/sh
    set -e
    if command -v gtk-update-icon-cache >/dev/null 2>&1; then
      gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
    fi
    if command -v update-desktop-database >/dev/null 2>&1; then
      update-desktop-database -q /usr/share/applications || true
    fi
  postremove: |
    #!/bin/sh
    set -e
    if command -v gtk-update-icon-cache >/dev/null 2>&1; then
      gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
    fi
